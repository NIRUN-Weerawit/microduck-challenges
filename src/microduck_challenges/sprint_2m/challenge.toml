# The 2 m Sprint: walk a flat 2 m lane as fast as possible. The Arena races the
# policy at forward commands from 0.20 to 1.20 m/s and keeps its best.
event = "sprint-2m"
task  = "Mjlab-Sprint2m-MicroDuck"
kind  = "perpetual"

[recipe]                  # the first training, as is
num_envs       = 10000
max_iterations = 3000
seed           = 1

[params.forward_reward]
label = "Forward race progress (no command speed ceiling)"
value = 5.0
min   = 0.5
max   = 5.0

[params.upright_reward]
label = "Stay upright"
value = 1.03649635036496
min   = 0.5
max   = 5.0

[params.step_reward]
label = "Completed alternating steps (free cadence)"
value = 3.47931873479319
min   = 0.0
max   = 6.0

# Positive objectives: zero disables a term. Penalties below use signed weights:
# closer to zero is weaker. Action smoothing sets the final curriculum strength.
[params.angular_velocity_reward]
label = "Track commanded yaw rate"
value = 2.0
min = 0.0
max = 5.0

[params.pose_reward]
label = "Keep legs near default pose"
value = 0.336577453365775
min = 0.0
max = 5.0

[params.body_ang_vel_reward]
label = "Trunk rotation penalty (negative)"
value = -0.05
min = -1.0
max = 0.0

[params.angular_momentum_reward]
label = "Angular momentum penalty (negative)"
value = -0.02
min = -1.0
max = 0.0

[params.joint_limits_reward]
label = "Joint limit penalty (negative)"
value = -1.0
min = -5.0
max = 0.0

[params.action_rate_reward]
label = "Action smoothing final penalty (negative)"
value = -0.5
min = -2.0
max = 0.0

[params.foot_clearance_reward]
label = "Foot clearance penalty (negative)"
value = -2.0
min = -5.0
max = 0.0

[params.foot_swing_height_reward]
label = "Swing height error penalty (negative)"
value = -0.25
min = -5.0
max = 0.0

[params.foot_slip_reward]
label = "Foot slip penalty (negative)"
value = -0.1
min = -2.0
max = 0.0

[params.self_collisions_reward]
label = "Self-collision penalty (negative)"
value = -1.0
min = -5.0
max = 0.0

[params.heading_hold_reward]
label = "Keep original heading"
value = 0.206812652068127
min = 0.0
max = 5.0

[params.body_pose_reward]
label = "Track body pose (disabled by default)"
value = 0.0
min = 0.0
max = 5.0
