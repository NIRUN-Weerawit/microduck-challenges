# The 2 m Sprint: walk a flat 2 m lane as fast as possible. The Arena races the
# policy at forward commands from 0.20 to 1.20 m/s and keeps its best.
event = "sprint-2m"
task  = "Mjlab-Sprint2m-MicroDuck"
kind  = "perpetual"

[recipe]                  # the first training, as is
num_envs       = 4096
max_iterations = 3000
seed           = 42

[params.forward_reward]
label = "Follow the speed order"
value = 5.0
min   = 0.5
max   = 5.0

[params.upright_reward]
label = "Stay upright"
value = 1.26186708860759
min   = 0.5
max   = 5.0

[params.step_reward]
label = "Track alternating step cadence"
value = 4.60443037974684
min   = 0.0
max   = 6.0
